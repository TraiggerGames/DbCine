spring.application.name=dbcine

# ===============================
# CONFIGURACIÓN POSTGRESQL
# ===============================
# (Estos datos los usará tu PostgresConfig.java)
spring.datasource.url=jdbc:postgresql://litten.myqnapcloud.com:5432/dbcine
spring.datasource.username=perridan
spring.datasource.password=perridan
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
