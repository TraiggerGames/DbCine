# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# CONFIGURACIÓN MONGODB (ATLAS)
# ===============================
# ¡Importante! Asegúrate de usar el prefijo 'spring.data.mongodb'
spring.data.mongodb.uri=mongodb+srv://danielrechaduran:eXu8HE4SfyRXu2jy@traigger.frqjmys.mongodb.net/
spring.data.mongodb.database=dbcine

# ===============================
# AJUSTES DE LA API
# ===============================
# Permite ver Swagger en: http://localhost:8080/swagger-ui/index.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Evita que las consultas a la DB se mantengan abiertas demasiado tiempo en la vista
spring.jpa.open-in-view=false